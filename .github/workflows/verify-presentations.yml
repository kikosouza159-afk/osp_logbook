name: Verificar Apresentações
on:
  pull_request:
    paths:
      - 'src/components/presentation-studio*'
      - 'src/app/(protected)/apresentacao/**'
      - 'src/app/api/presentations/**'
      - 'src/components/sidebar.tsx'
      - 'package.json'
      - '.github/workflows/verify-presentations.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Compilar Next.js
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          SESSION_SECRET: local-ci-only-secret-1234567890
        run: npm run build
